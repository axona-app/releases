name: Feature request
description: Something Axona should do, or do differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do
      description: The task, in your own words. A real example helps more than a feature name.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The workaround you use now, if any.
  - type: textarea
    id: idea
    attributes:
      label: What would help
